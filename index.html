<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canova - Interior Design & Cabinetry</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <style>
    /* Custom styling for smooth Apple-like effects */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">

  <!-- Header/Toolbar -->
  <header class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="#hero" class="text-2xl font-bold text-gray-900">Canova</a>
      <nav class="hidden md:flex space-x-6">
        <a href="#about" class="text-gray-600 hover:text-gray-900">About</a>
        <a href="#services" class="text-gray-600 hover:text-gray-900">Services</a>
        <a href="#portfolio" class="text-gray-600 hover:text-gray-900">Portfolio</a>
        <a href="#contact" class="text-gray-600 hover:text-gray-900">Contact</a>
      </nav>
      <button id="menu-btn" class="md:hidden text-gray-600 focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
        </svg>
      </button>
    </div>
    <div id="mobile-menu" class="hidden md:hidden bg-white shadow-md">
      <a href="#about" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">About</a>
      <a href="#services" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">Services</a>
      <a href="#portfolio" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">Portfolio</a>
      <a href="#contact" class="block px-4 py-2 text-gray-600 hover:bg-gray-100">Contact</a>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="hero" class="relative bg-cover bg-center h-screen" style="background-image: url('https://picsum.photos/1920/1080?random=1');">
    <div class="absolute inset-0 bg-black bg-opacity-50"></div>
    <div class="relative flex flex-col items-center justify-center h-full text-center text-white">
      <h1 class="text-5xl font-bold uppercase tracking-wider fade-in">Canova</h1>
      <p class="mt-4 text-lg fade-in">Crafting timeless interiors with precision and elegance.</p>
      <a href="#services" class="mt-8 px-6 py-3 bg-white text-gray-900 font-semibold rounded-lg shadow-md hover:bg-gray-200 fade-in">
        Explore Our Services
      </a>
    </div>
  </section>

  <!-- Other Sections -->
  <!-- The rest of the sections (About, Services, Portfolio, Contact, Footer) remain unchanged -->

  <!-- Anime.js Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Apply fade-in animations
      anime({
        targets: '.fade-in',
        opacity: [0, 1],
        translateY: [30, 0],
        easing: 'easeOutExpo',
        duration: 1000,
        delay: anime.stagger(200) // Adds a delay between elements
      });

      // Menu Toggle for Mobile
      const menuBtn = document.getElementById('menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');

      menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
      });
    });
  </script>

</body>
</html>
